<form novalidate [formGroup]="loginFormGroup" (ngSubmit)="onFormSubmit()">
  <div>
    <label for="email">Email: </label>
    <input type="email" id="email" formControlName="email" />

    @if (loginFormGroup.controls.email.invalid) {
    <small class="text-error">Email is required.</small>
    }
  </div>

  <div>
    <label for="password">Password: </label>
    <input type="password" id="password" formControlName="password" required minlength="6" />
    @if (loginFormGroup.controls.password.invalid) {
    <small class="text-error">Password is required and must be at least 6 characters long.</small>
    }
  </div>

  <button type="submit" [disabled]="loginFormGroup.invalid">Submit</button>
</form>
